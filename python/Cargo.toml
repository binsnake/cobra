[package]
name = "cobra-mba-python"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Python bindings for the CoBRA mixed Boolean-arithmetic simplifier"
repository = "https://github.com/binsnake/cobra"
publish = false

# Standalone package: stop Cargo from searching upward for a workspace root.
[workspace]

[lib]
name = "cobra_mba_native"
crate-type = ["cdylib"]

[features]
default = ["simd"]
simd = ["cobra/simd"]
z3 = ["cobra/z3"]

[dependencies]
cobra = { package = "cobra-mba", path = "..", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = "thin"
codegen-units = 1
