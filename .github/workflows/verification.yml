name: Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dynamic-linking:
    name: Dynamic linking (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C prefer-dynamic

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build the single package in dynamic-linking mode
        run: cargo build --lib --locked

      - name: Run the dynamically linked CLI
        run: cargo run --bin cobra-cli --features cli --locked -- --mba "(x ^ y) + 2 * (x & y)"

  rust-and-lean:
    name: Rust and Lean verification
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --features cli --locked

      - name: Install Z3 development headers
        run: sudo apt-get install -y libz3-dev

      - name: Check the Z3 verifier backend
        run: cargo check --features z3 --all-targets --locked

      - name: Check release metadata
        run: python tools/release.py check

      - name: Lint all targets
        run: cargo clippy --all-targets --features cli --locked -- -D warnings

      - name: Check the publishable package
        run: cargo package --locked

      - name: Check proof coverage invariants
        run: cargo test proof_coverage::tests

      - name: Test package
        run: cargo test --features cli --locked

      - name: Test scalar fallback
        run: cargo test --no-default-features --locked

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean verification layer
        working-directory: formal/lean
        run: lake build

      - name: Replay generated Lean certificates from real pass outputs
        env:
          COBRA_LEAN_REPLAY: "1"
        run: cargo test --test generated_lean_replay

      - name: Reject unchecked Lean placeholders
        shell: bash
        run: |
          if rg -n '\b(sorry|admit)\b' \
            formal/lean \
            crates
          then
            echo "::error::Lean verification placeholders are not allowed"
            exit 1
          fi
