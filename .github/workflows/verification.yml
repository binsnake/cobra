name: Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner:
    name: Select runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      dynamic_matrix: ${{ steps.pick.outputs.dynamic_matrix }}

    steps:
      # A pull request from a fork carries an attacker-controlled workflow
      # file, so it must never reach self-hosted hardware. Those runs go to
      # GitHub-hosted runners instead, which keeps fork coverage complete
      # without exposing the box.
      - name: Choose where the Linux jobs run
        id: pick
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            linux='"ubuntu-latest"'
            echo "fork pull request: Linux jobs run on GitHub-hosted runners"
          else
            linux='["self-hosted","linux","x64","rustbox"]'
            echo "trusted event: Linux jobs run on rustbox"
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          printf 'dynamic_matrix={"include":[{"name":"linux","os":%s},{"name":"windows","os":"windows-latest"}]}\n' \
            "$linux" >> "$GITHUB_OUTPUT"

  dynamic-linking:
    name: Dynamic linking (${{ matrix.name }})
    needs: runner
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runner.outputs.dynamic_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C prefer-dynamic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Build the single package in dynamic-linking mode
        run: cargo build --lib --locked

      - name: Run the dynamically linked CLI
        run: cargo run --bin cobra-cli --features cli --locked -- --mba "(x ^ y) + 2 * (x & y)"

  rust-and-lean:
    name: Rust and Lean verification
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.linux) }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --features cli --locked

      - name: Install Z3 development headers
        run: sudo apt-get install -y libz3-dev

      - name: Check the Z3 verifier backend
        run: cargo check --features z3 --all-targets --locked

      - name: Check release metadata
        run: python3 tools/release.py check

      - name: Check that both lock files agree
        run: python3 tools/check_locks.py

      - name: Lint all targets
        run: cargo clippy --all-targets --features cli --locked -- -D warnings

      - name: Check the publishable package
        run: cargo package --locked

      - name: Check proof coverage invariants
        run: cargo test proof_coverage::tests

      - name: Test package
        run: cargo test --features cli --locked

      - name: Test scalar fallback
        run: cargo test --no-default-features --locked

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Lean verification layer
        working-directory: formal/lean
        run: lake build

      - name: Replay generated Lean certificates from real pass outputs
        env:
          COBRA_LEAN_REPLAY: "1"
        run: cargo test --test generated_lean_replay

      - name: Reject unchecked Lean placeholders
        shell: bash
        run: |
          # Lean sources: `sorry` and `admit` are the placeholder tactics, so
          # any occurrence is a finding.
          if rg -n '\b(sorry|admit)\b' formal/lean; then
            echo "::error::Lean verification placeholders are not allowed"
            exit 1
          fi
          # Rust sources: the same words turn up as ordinary English in
          # comments, which is what made this check fail on every commit since
          # August. Comment lines are skipped; a placeholder that actually
          # reached generated Lean would be in code, not in prose.
          if rg -n --pcre2 '^\s*(?!//)\S.*\b(sorry|admit)\b' crates; then
            echo "::error::Lean verification placeholders are not allowed"
            exit 1
          fi
